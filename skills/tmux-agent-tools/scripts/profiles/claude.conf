# Bundled default profile for Claude Code (mirrors the legacy preset).
bin=claude
env_ns=CLAUDE
prefix=claude-cli
launch_flags=--dangerously-skip-permissions
resume_keyword=--resume
heuristic_family=claude
usage_kind=Code
# start --headless invocation: claude --dangerously-skip-permissions -p '<prompt>'
headless_flags=--dangerously-skip-permissions
headless_prompt_flag=-p
# session_id_pattern: UNSET — no verified deterministic session-label format
# confirmed for Claude Code across versions; resume is unsupported by default
# (guardrail #2). Set this in a user-local profile once you know the label line
# your version prints, e.g.:  session_id_pattern=Session ID:
# Capture is label-anchored: finds the first line matching the pattern, then
# extracts + validates the RFC-4122 UUID from that line only.
