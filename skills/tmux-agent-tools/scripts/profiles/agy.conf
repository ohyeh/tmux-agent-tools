# Bundled default profile for agy (mirrors the legacy preset).
bin=agy
env_ns=AGY
prefix=agy-cli
launch_flags=--dangerously-skip-permissions
effort_flags=--effort %s
resume_keyword=resume
heuristic_family=generic
usage_kind=CLI
# start --headless invocation: agy --dangerously-skip-permissions -p '<prompt>'
headless_flags=--dangerously-skip-permissions
headless_prompt_flag=-p
