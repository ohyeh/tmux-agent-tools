# Bundled default profile for Cursor Agent CLI.
# The editor binary is `cursor`; the coding CLI is `cursor-agent`.
# Do not set bin=agent — that name collides with Grok CLI on PATH.
bin=cursor-agent
env_ns=CURSOR
prefix=cursor-cli
launch_flags=--force --trust --approve-mcps
resume_keyword=resume
heuristic_family=generic
usage_kind=CLI
# start --headless: cursor-agent --force --trust --approve-mcps -p '<prompt>'
headless_flags=--force --trust --approve-mcps
headless_prompt_flag=-p
