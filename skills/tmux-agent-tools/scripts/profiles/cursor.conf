# Bundled default profile for Cursor CLI (mirrors the legacy preset).
# The agent CLI installs as `cursor-agent`; `cursor` is the editor launcher and
# never starts an agent TUI. Line 268 of agent-tmux does one `command -v` with
# no fallback, so a wrong name fails at the `start` step with
# `cursor not found at <empty>`. Override per machine with CURSOR=/path/to/bin.
bin=cursor-agent
env_ns=CURSOR
prefix=cursor-cli
launch_flags=
resume_keyword=resume
heuristic_family=generic
usage_kind=CLI
