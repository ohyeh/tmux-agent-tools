# Bundled default profile for Codex CLI (mirrors the legacy preset).
bin=codex
env_ns=CODEX
prefix=codex-cli
launch_flags=--yolo
effort_flags=-c model_reasoning_effort=%s
resume_keyword=resume
heuristic_family=codex
usage_kind=CLI
# start --headless invocation: codex exec --dangerously-bypass-approvals-and-sandbox '<prompt>'
# (codex exec has no --yolo alias; prompt is positional, so no prompt flag)
headless_flags=exec --dangerously-bypass-approvals-and-sandbox
# session_id_pattern: UNSET — no verified deterministic session-label format
# confirmed for Codex CLI across versions; resume is unsupported by default
# (guardrail #2). Set this in a user-local profile once you know the label line
# your version prints, e.g.:  session_id_pattern=Session ID:
# Capture is label-anchored: finds the first line matching the pattern, then
# extracts + validates the RFC-4122 UUID from that line only.
