name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install runtime tools
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          brew list jq >/dev/null 2>&1 || brew install jq
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep

      - name: Validate shell scripts
        run: |
          zsh -n skills/tmux-agent-tools/scripts/claude-tmux
          zsh -n skills/tmux-agent-tools/scripts/codex-tmux
          zsh -n skills/tmux-agent-tools/scripts/tmux-agent-dialogue
          zsh -n skills/tmux-agent-tools/scripts/tmux-agent-sessions

      - name: Validate skill metadata
        run: |
          ruby -e '
            require "yaml"
            path = "skills/tmux-agent-tools/SKILL.md"
            text = File.read(path)
            abort("#{path}: missing frontmatter") unless text.start_with?("---\n")
            _, frontmatter, body = text.split(/^---\s*$/, 3)
            data = YAML.safe_load(frontmatter)
            abort("#{path}: missing name") unless data["name"] == "tmux-agent-tools"
            abort("#{path}: missing description") unless data["description"].to_s.length > 20
            abort("#{path}: missing body") unless body.to_s.include?("claude-tmux") && body.to_s.include?("codex-tmux")
          '

      - name: Validate Homebrew formula
        run: |
          ruby -c Formula/tmux-agent-tools.rb
          brew style Formula/tmux-agent-tools.rb

      - name: Run wrapper self-tests
        run: |
          skills/tmux-agent-tools/scripts/codex-tmux self-test
          skills/tmux-agent-tools/scripts/claude-tmux self-test
          skills/tmux-agent-tools/scripts/tmux-agent-sessions list --json | jq -s 'length == 0'
          watch_zero_output="$(skills/tmux-agent-tools/scripts/tmux-agent-sessions list --watch --json --count 0)"
          test -z "$watch_zero_output"
          watch_bad_count_output="$(mktemp)"
          if skills/tmux-agent-tools/scripts/tmux-agent-sessions list --watch --json --count nope >"$watch_bad_count_output" 2>&1; then
            echo "watch --count must reject non-integers" >&2
            exit 1
          fi
          rg -n -- "--count requires a non-negative integer" "$watch_bad_count_output"
          skills/tmux-agent-tools/scripts/claude-tmux status --json missing-ci-status | jq -e '.tool == "claude" and .name == "missing-ci-status" and .exists == false and .running == false and .exit_detected == false and .exit_code == null and .local_or_remote == null and .diagnostic == null and .last_capture_lines == [] and .confirmation_detected == false and .blocked_reason == null'
          skills/tmux-agent-tools/scripts/codex-tmux status --json missing-ci-status | jq -e '.tool == "codex" and .name == "missing-ci-status" and .exists == false and .running == false and .exit_detected == false and .exit_code == null and .local_or_remote == null and .diagnostic == null and .last_capture_lines == [] and .confirmation_detected == false and .blocked_reason == null'
          fake_cli_dir="$(mktemp -d)"
          printf '%s\n' '#!/bin/sh' 'sleep 1' > "$fake_cli_dir/claude"
          printf '%s\n' '#!/bin/sh' 'sleep 1' > "$fake_cli_dir/codex"
          chmod +x "$fake_cli_dir/claude" "$fake_cli_dir/codex"
          claude_clipboard_conf="$(mktemp)"
          codex_clipboard_conf="$(mktemp)"
          CLAUDE="$fake_cli_dir/claude" CLAUDE_TMUX_CONF="$claude_clipboard_conf" CLAUDE_TMUX_CLIPBOARD=internal skills/tmux-agent-tools/scripts/claude-tmux start --exact ci-clipboard . >/tmp/claude-clipboard.out
          CODEX="$fake_cli_dir/codex" CODEX_TMUX_CONF="$codex_clipboard_conf" CODEX_TMUX_CLIPBOARD='sh -c "cat >/tmp/tmux-agent-tools-ci-copy"' skills/tmux-agent-tools/scripts/codex-tmux start --exact ci-clipboard . >/tmp/codex-clipboard.out
          rg -n 'set -g mouse "on"' "$claude_clipboard_conf"
          rg -n 'copy-selection-and-cancel' "$claude_clipboard_conf"
          rg -n 'MouseDragEnd1Pane send -X copy-selection-and-cancel' "$claude_clipboard_conf"
          rg -n 'copy-pipe-and-cancel "sh -c \\"cat >/tmp/tmux-agent-tools-ci-copy\\""' "$codex_clipboard_conf"
          rg -n 'MouseDragEnd1Pane send -X copy-pipe-and-cancel "sh -c \\"cat >/tmp/tmux-agent-tools-ci-copy\\""' "$codex_clipboard_conf"
          CLAUDE="$fake_cli_dir/claude" CLAUDE_TMUX_CLIPBOARD=internal skills/tmux-agent-tools/scripts/claude-tmux doctor | rg -n 'clipboard: internal'
          CODEX="$fake_cli_dir/codex" CODEX_TMUX_CLIPBOARD='sh -c "cat >/tmp/tmux-agent-tools-ci-copy"' skills/tmux-agent-tools/scripts/codex-tmux doctor | rg -n 'clipboard: sh -c "cat >/tmp/tmux-agent-tools-ci-copy"'
          skills/tmux-agent-tools/scripts/claude-tmux stop ci-clipboard
          skills/tmux-agent-tools/scripts/codex-tmux stop ci-clipboard
          tmux new-session -d -s claude-cli-ci-hygiene 'sleep 300'
          tmux new-session -d -s codex-cli-ci-hygiene 'sleep 300'
          tmux new-session -d -s tmux-agent-dialogue-ci-hygiene-a 'sleep 300'
          tmux new-session -d -s unrelated-ci-hygiene 'sleep 300'
          skills/tmux-agent-tools/scripts/claude-tmux status --json ci-hygiene | jq -e '.tool == "claude" and .name == "ci-hygiene" and .session == "claude-cli-ci-hygiene" and .prefix == "claude-cli" and .exists == true and .running == true and .exit_detected == false and .exit_code == null and .local_or_remote == "local" and (.last_capture_lines | type == "array" and length <= 20) and .confirmation_detected == false and .blocked_reason == null'
          skills/tmux-agent-tools/scripts/codex-tmux status --json ci-hygiene | jq -e '.tool == "codex" and .name == "ci-hygiene" and .session == "codex-cli-ci-hygiene" and .prefix == "codex-cli" and .exists == true and .running == true and .exit_detected == false and .exit_code == null and .local_or_remote == "local" and (.last_capture_lines | type == "array" and length <= 20) and .confirmation_detected == false and .blocked_reason == null'
          skills/tmux-agent-tools/scripts/tmux-agent-sessions list --json | jq -s 'length == 3 and ([.[].tool] | sort == ["claude","codex","dialogue"]) and (map(select(.tool == "claude" or .tool == "codex")) | all(.state == "running" and .exists == true and .running == true and .exit_detected == false and .exit_code == null and .local_or_remote == "local")) and (map(select(.tool == "dialogue")) | all(.state == "running" and .exists == true and .running == true and .exit_detected == false and .exit_code == null and .local_or_remote == null))'
          skills/tmux-agent-tools/scripts/tmux-agent-sessions list --watch --json --count 2 --interval 0 | jq -s 'length == 2 and all(type == "array" and length == 3 and ([.[].tool] | sort == ["claude","codex","dialogue"]) and (map(select(.tool == "claude" or .tool == "codex")) | all(.state == "running" and .exists == true and .running == true and .exit_detected == false and .exit_code == null and .local_or_remote == "local")) and (map(select(.tool == "dialogue")) | all(.state == "running" and .exists == true and .running == true and .exit_detected == false and .exit_code == null and .local_or_remote == null)))'
          skills/tmux-agent-tools/scripts/tmux-agent-sessions cleanup --preview | rg -n "claude-cli-ci-hygiene|codex-cli-ci-hygiene|tmux-agent-dialogue-ci-hygiene-a"
          skills/tmux-agent-tools/scripts/tmux-agent-sessions cleanup --preview | rg -n $'would stop: (claude|codex|dialogue)\\tci-hygiene(-a)?\\t(claude-cli|codex-cli|tmux-agent-dialogue)-ci-hygiene(-a)?\\trunning'
          tmux has-session -t unrelated-ci-hygiene
          skills/tmux-agent-tools/scripts/tmux-agent-sessions cleanup --execute --name ci-hygiene
          skills/tmux-agent-tools/scripts/tmux-agent-sessions cleanup --execute --tool dialogue --name ci-hygiene-a
          if tmux has-session -t claude-cli-ci-hygiene 2>/dev/null || tmux has-session -t codex-cli-ci-hygiene 2>/dev/null || tmux has-session -t tmux-agent-dialogue-ci-hygiene-a 2>/dev/null; then
            echo "owned hygiene sessions should have been stopped" >&2
            exit 1
          fi
          tmux has-session -t unrelated-ci-hygiene
          tmux kill-session -t unrelated-ci-hygiene
          tmux new-session -d -s claude-cli-ci-status-exited 'printf "local command exited with code 7\n"; sleep 300'
          tmux new-session -d -s codex-cli-ci-status-exited 'printf "remote command exited with code 2\n"; sleep 300'
          sleep 0.2
          CLAUDE_TMUX_STATUS_TAIL_LINES=1 skills/tmux-agent-tools/scripts/claude-tmux status --json ci-status-exited | jq -e '.tool == "claude" and .exists == true and .running == false and .exit_detected == true and .exit_code == 7 and .local_or_remote == "local" and (.last_capture_lines | length == 1 and .[0] == "local command exited with code 7") and .confirmation_detected == false and .blocked_reason == "cli_exited"'
          CODEX_TMUX_STATUS_TAIL_LINES=1 skills/tmux-agent-tools/scripts/codex-tmux status --json ci-status-exited | jq -e '.tool == "codex" and .exists == true and .running == false and .exit_detected == true and .exit_code == 2 and .local_or_remote == "remote" and (.last_capture_lines | length == 1 and .[0] == "remote command exited with code 2") and .confirmation_detected == false and .blocked_reason == "cli_exited"'
          tmux new-session -d -s claude-cli-ci-status-prompt 'printf "Do you want to proceed?\\n"; sleep 300'
          tmux new-session -d -s codex-cli-ci-status-prompt 'printf "approval required [y/n]\\n"; sleep 300'
          sleep 0.2
          skills/tmux-agent-tools/scripts/claude-tmux status --json ci-status-prompt | jq -e '.tool == "claude" and .exists == true and .running == true and .confirmation_detected == true and .blocked_reason == "permission_prompt" and (.diagnostic | type == "string")'
          skills/tmux-agent-tools/scripts/codex-tmux status --json ci-status-prompt | jq -e '.tool == "codex" and .exists == true and .running == true and .confirmation_detected == true and .blocked_reason == "approval_prompt" and (.diagnostic | type == "string")'
          skills/tmux-agent-tools/scripts/tmux-agent-sessions list --json --name ci-status-prompt | jq -s 'length == 2 and any(.tool == "claude" and .confirmation_detected == true and .blocked_reason == "permission_prompt") and any(.tool == "codex" and .confirmation_detected == true and .blocked_reason == "approval_prompt")'
          tmux kill-session -t claude-cli-ci-status-prompt
          tmux kill-session -t codex-cli-ci-status-prompt
          skills/tmux-agent-tools/scripts/tmux-agent-sessions list --json --name ci-status-exited | jq -s 'length == 2 and any(.tool == "claude" and .state == "exited" and .exists == true and .running == false and .exit_detected == true and .exit_code == 7 and .local_or_remote == "local") and any(.tool == "codex" and .state == "exited" and .exists == true and .running == false and .exit_detected == true and .exit_code == 2 and .local_or_remote == "remote")'
          skills/tmux-agent-tools/scripts/tmux-agent-sessions cleanup --preview --json --name ci-status-exited | jq -s 'length == 2 and any(.tool == "claude" and .state == "exited" and .exists == true and .running == false and .exit_detected == true and .exit_code == 7 and .local_or_remote == "local") and any(.tool == "codex" and .state == "exited" and .exists == true and .running == false and .exit_detected == true and .exit_code == 2 and .local_or_remote == "remote")'
          tmux kill-session -t claude-cli-ci-status-exited
          tmux kill-session -t codex-cli-ci-status-exited
          long_marker="WRAPSTART_$(printf '%120s' '' | tr ' ' x)_WRAPEND"
          tmux new-session -d -x 40 -y 10 -s claude-cli-ci-wrap "printf '%s\n' '$long_marker'; sleep 300"
          tmux new-session -d -x 40 -y 10 -s codex-cli-ci-wrap "printf '%s\n' '$long_marker'; sleep 300"
          sleep 0.2
          skills/tmux-agent-tools/scripts/claude-tmux capture ci-wrap 5 | rg -n "$long_marker"
          skills/tmux-agent-tools/scripts/codex-tmux capture ci-wrap 5 | rg -n "$long_marker"
          tmux kill-session -t claude-cli-ci-wrap
          tmux kill-session -t codex-cli-ci-wrap
          prompt_file="$(mktemp)"
          transcript_file="$(mktemp)"
          printf '%s\n' 'Discuss the smoke test.' > "$prompt_file"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 4 --workdir . --agent-a fake --agent-b fake --prompt-file "$prompt_file" --transcript "$transcript_file" --timeout 10
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$transcript_file"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --schema-version 1 --transcript "$transcript_file"
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --schema-version 2 >/tmp/unsupported-schema-version.out 2>&1; then
            echo "unsupported transcript schema versions must fail" >&2
            exit 1
          fi
          rg -n "unsupported transcript schema version: 2" /tmp/unsupported-schema-version.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --schema-version "" --transcript "$transcript_file" >/tmp/empty-schema-version.out 2>&1; then
            echo "empty transcript schema versions must fail" >&2
            exit 1
          fi
          rg -n -- "--schema-version must be 1" /tmp/empty-schema-version.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue summarize --schema-version 1 --transcript "$transcript_file" >/tmp/schema-version-summary.out 2>&1; then
            echo "--schema-version must be scoped to validate-transcript" >&2
            exit 1
          fi
          rg -n -- "--schema-version is only supported with validate-transcript" /tmp/schema-version-summary.out
          jq -e 'select(.event == "turn" and .turn == 1 and .speaker == "agent-a" and (.text | contains("fake-a: turn 1 received")))' "$transcript_file"
          jq -e 'select(.event == "turn" and .turn == 2 and .speaker == "agent-b" and (.text | contains("fake-b: turn 2 received")))' "$transcript_file"
          jq -e 'select(.event == "turn" and .turn == 3 and .speaker == "agent-a" and (.text | contains("fake-a: turn 3 received")))' "$transcript_file"
          jq -e 'select(.event == "turn" and .turn == 4 and .speaker == "agent-b" and (.text | contains("fake-b: turn 4 received")))' "$transcript_file"
          participants_config="$(mktemp)"
          jq -n --arg workdir "$PWD" '{local_fake:{agent:"fake",workdir:$workdir}, local_codex:{agent:"codex",workdir:$workdir}, env_codex:{agent:"codex",workdir:$workdir,env:{TMUX_AGENT_TOOLS_PROFILE_ENV:"profile-ok"}}, needs_override:{agent:"fake",workdir:"/definitely/missing/tmux-agent-tools-profile"}, bad_fake:{agent:"fake",ssh:"example",workdir:"/tmp"}, bad_extra:{agent:"fake",extra:"nope"}, bad_type:{agent:true}, bad_env_key:{agent:"fake",env:{"BAD-NAME":"nope"}}, bad_env_type:{agent:"fake",env:{TMUX_AGENT_TOOLS_PROFILE_ENV:true}}, bad_env_newline:{agent:"fake",env:{TMUX_AGENT_TOOLS_PROFILE_ENV:"bad\nvalue"}}}' > "$participants_config"
          profile_transcript_file="$(mktemp)"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 2 --workdir . --agent-a-profile local_fake --agent-b-profile local_fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript "$profile_transcript_file" --timeout 10
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$profile_transcript_file"
          jq -e 'select(.event == "turn" and .turn == 1 and .agent == "fake" and .speaker == "agent-a")' "$profile_transcript_file"
          override_transcript_file="$(mktemp)"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 2 --workdir . --agent-a-profile needs_override --agent-a-workdir . --agent-b-profile local_fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript "$override_transcript_file" --timeout 10
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$override_transcript_file"
          env_fake_cli_dir="$(mktemp -d)"
          printf '%s\n' \
            '#!/usr/bin/env zsh' \
            'part_a=""' \
            'while IFS= read -r line; do' \
            '  case "$line" in' \
            '    "PART_A: "*) part_a="${line#PART_A: }" ;;' \
            '    "PART_B: "*) print -r -- "profile-env:${TMUX_AGENT_TOOLS_PROFILE_ENV-unset}"; print -r -- "${part_a}${line#PART_B: }" ;;' \
            '  esac' \
            'done' > "$env_fake_cli_dir/codex"
          chmod +x "$env_fake_cli_dir/codex"
          no_env_profile_transcript_file="$(mktemp)"
          CODEX="$env_fake_cli_dir/codex" skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile local_codex --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript "$no_env_profile_transcript_file" --timeout 10
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$no_env_profile_transcript_file"
          jq -e 'select(.event == "turn" and .turn == 1 and .agent == "codex" and (.text | contains("profile-env:unset")))' "$no_env_profile_transcript_file"
          env_profile_transcript_file="$(mktemp)"
          CODEX="$env_fake_cli_dir/codex" skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile env_codex --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript "$env_profile_transcript_file" --timeout 10
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$env_profile_transcript_file"
          jq -e 'select(.event == "turn" and .turn == 1 and .agent == "codex" and (.text | contains("profile-env:profile-ok")))' "$env_profile_transcript_file"
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile missing --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript /tmp/missing-profile.jsonl --timeout 1 >/tmp/missing-profile.out 2>&1; then
            echo "missing profiles must fail" >&2
            exit 1
          fi
          rg -n "participant profile not found: missing|available: .*local_fake" /tmp/missing-profile.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile bad_extra --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript /tmp/bad-extra-profile.jsonl --timeout 1 >/tmp/bad-extra-profile.out 2>&1; then
            echo "participant profiles with unknown keys must fail" >&2
            exit 1
          fi
          rg -n "may only contain agent, ssh, workdir, and env" /tmp/bad-extra-profile.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile bad_type --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript /tmp/bad-type-profile.jsonl --timeout 1 >/tmp/bad-type-profile.out 2>&1; then
            echo "participant profiles with non-string values must fail" >&2
            exit 1
          fi
          rg -n "values must be strings, except env must be an object" /tmp/bad-type-profile.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile bad_env_key --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript /tmp/bad-env-key-profile.jsonl --timeout 1 >/tmp/bad-env-key-profile.out 2>&1; then
            echo "participant profile env keys must be shell environment names" >&2
            exit 1
          fi
          rg -n "env must be an object of newline-free string values keyed by shell environment names" /tmp/bad-env-key-profile.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile bad_env_type --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript /tmp/bad-env-type-profile.jsonl --timeout 1 >/tmp/bad-env-type-profile.out 2>&1; then
            echo "participant profile env values must be strings" >&2
            exit 1
          fi
          rg -n "env must be an object of newline-free string values keyed by shell environment names" /tmp/bad-env-type-profile.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile bad_env_newline --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript /tmp/bad-env-newline-profile.jsonl --timeout 1 >/tmp/bad-env-newline-profile.out 2>&1; then
            echo "participant profile env values must be newline-free" >&2
            exit 1
          fi
          rg -n "env must be an object of newline-free string values keyed by shell environment names" /tmp/bad-env-newline-profile.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a-profile bad_fake --agent-b fake --participants-config "$participants_config" --prompt-file "$prompt_file" --transcript /tmp/bad-fake-profile.jsonl --timeout 1 >/tmp/bad-fake-profile.out 2>&1; then
            echo "fake profile SSH must fail" >&2
            exit 1
          fi
          rg -n -- "--agent-a-ssh cannot be used with --agent-a fake" /tmp/bad-fake-profile.out
          timeout_transcript_file="$(mktemp)"
          if TMUX_AGENT_DIALOGUE_TEST_TIMEOUT_FAKE_TURN=1 skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a fake --agent-b fake --prompt-file "$prompt_file" --transcript "$timeout_transcript_file" --timeout 1; then
            echo "timeout test should fail" >&2
            exit 1
          fi
          jq -e 'select(.event == "failure" and .failure_type == "marker_timeout")' "$timeout_transcript_file"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$timeout_transcript_file"
          missing_session_transcript_file="$(mktemp)"
          if TMUX_AGENT_DIALOGUE_TEST_KILL_FAKE_TURN=1 skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 1 --workdir . --agent-a fake --agent-b fake --prompt-file "$prompt_file" --transcript "$missing_session_transcript_file" --timeout 1; then
            echo "missing session test should fail" >&2
            exit 1
          fi
          jq -e 'select(.event == "failure" and .failure_type == "session_missing")' "$missing_session_transcript_file"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$missing_session_transcript_file"
          blocked_transcript_file="$(mktemp)"
          blocked_trigger_file="$(mktemp)"
          rm -f "$blocked_trigger_file"
          if TMUX_AGENT_DIALOGUE_TEST_BLOCKED_FAKE_TURN=1 skills/tmux-agent-tools/scripts/tmux-agent-dialogue pair-review --workdir . --agent-a fake --agent-b fake --prompt-file "$prompt_file" --transcript "$blocked_transcript_file" --on-blocked-trigger "$blocked_trigger_file" --timeout 1; then
            echo "blocked fake turn should fail" >&2
            exit 1
          fi
          jq -e 'select(.event == "failure" and .failure_type == "permission_prompt")' "$blocked_transcript_file"
          jq -e '.event == "blocked" and .participant == "agent-a" and .agent == "fake" and .blocked_reason == "permission_prompt" and (.timestamp | type == "string" and length > 0)' "$blocked_trigger_file"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$blocked_transcript_file"
          invalid_transcript_file="$(mktemp)"
          printf '%s\n' '{"event":"turn"}' > "$invalid_transcript_file"
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$invalid_transcript_file" >/tmp/invalid-transcript.out 2>&1; then
            echo "invalid transcripts must fail validation" >&2
            exit 1
          fi
          rg -n "turn must be|speaker must be|agent must be|marker must be|timestamp must be|text must be" /tmp/invalid-transcript.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue summarize --transcript "$invalid_transcript_file" >/tmp/invalid-summary.out 2>&1; then
            echo "summarize must reject invalid transcripts" >&2
            exit 1
          fi
          rg -n "turn must be|speaker must be" /tmp/invalid-summary.out
          if skills/tmux-agent-tools/scripts/tmux-agent-dialogue github-comment --transcript "$invalid_transcript_file" --github-pr 1 --github-repo ohyeh/tmux-agent-tools >/tmp/invalid-comment.out 2>&1; then
            echo "github-comment must reject invalid transcripts" >&2
            exit 1
          fi
