name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver tag to create, for example v0.2.1"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Validate inputs and release notes without creating a tag or release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      tested_sha: ${{ steps.record_sha.outputs.sha }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record candidate commit SHA
        id: record_sha
        run: |
          tested_sha="$(git rev-parse HEAD)"
          echo "sha=${tested_sha}" >> "$GITHUB_OUTPUT"
          echo "Validated candidate SHA: ${tested_sha}"

      - name: Install runtime tools
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          brew list jq >/dev/null 2>&1 || brew install jq
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          # The runner's own sqlite3 has no FTS5 (tmux-agent-history needs it); same as ci.yml.
          brew list sqlite >/dev/null 2>&1 || brew install sqlite
          echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"

      - name: Set up the core's Node floor
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0

      - name: mcp-adapter tests (node 22.18.0)
        run: cd mcp-adapter && npm ci && npm test

      - name: Guard tmux socket isolation
        run: scripts/check-tmux-socket-isolation

      - name: Install Claude Code for plugin test
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "CLAUDE_BIN=$(npm prefix -g)/bin/claude" >> "$GITHUB_ENV"
          "$(npm prefix -g)/bin/claude" --version

      - name: Install smoke CLI stubs
        run: |
          stub_cli_dir="$RUNNER_TEMP/tmux-agent-tools-cli-stubs"
          mkdir -p "$stub_cli_dir"
          printf '%s\n' '#!/bin/sh' 'sleep 300' > "$stub_cli_dir/claude"
          printf '%s\n' '#!/bin/sh' 'sleep 300' > "$stub_cli_dir/codex"
          chmod +x "$stub_cli_dir/claude" "$stub_cli_dir/codex"
          echo "$stub_cli_dir" >> "$GITHUB_PATH"

      - name: Run full smoke suite (private tmux isolation)
        run: |
          unset TMUX TMUX_PANE
          export TMUX_TMPDIR="$(mktemp -d /tmp/tas-rel.XXXXXX)"
          trap '[[ -n "${TMUX_TMPDIR:-}" ]] && env -u TMUX -u TMUX_PANE tmux -S "$TMUX_TMPDIR/tmux-$(id -u)/default" kill-server 2>/dev/null; rm -rf "$TMUX_TMPDIR"' EXIT
          scripts/run-all-smokes

      - name: Validate release candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "release workflow must run from main; got ${GITHUB_REF}" >&2
            exit 1
          fi
          ruby -e 'abort("version must look like vX.Y.Z") unless ENV.fetch("VERSION").match?(/\Av\d+\.\d+\.\d+\z/)'
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "tag already exists: ${VERSION}" >&2
            exit 1
          fi
          unset TMUX TMUX_PANE
          export TMUX_TMPDIR="$(mktemp -d /tmp/tas-diag.XXXXXX)"
          trap '[[ -n "${TMUX_TMPDIR:-}" ]] && env -u TMUX -u TMUX_PANE tmux -S "$TMUX_TMPDIR/tmux-$(id -u)/default" kill-server 2>/dev/null; rm -rf "$TMUX_TMPDIR"' EXIT
          zsh -n skills/tmux-agent-tools/scripts/agent-tmux
          zsh -n skills/tmux-agent-tools/scripts/tmux-agent-dialogue
          zsh -n skills/tmux-agent-tools/scripts/tmux-agent-sessions
          skills/tmux-agent-tools/scripts/agent-tmux codex self-test
          skills/tmux-agent-tools/scripts/agent-tmux claude self-test
          scripts/test-version-sync-smoke
          scripts/test-session-meta-smoke
          scripts/test-oneshot-smoke
          skills/tmux-agent-tools/scripts/tmux-agent-sessions list --json | jq -se 'length == 0'
          prompt_file="$(mktemp)"
          transcript_file="$(mktemp)"
          printf '%s\n' 'Run a release workflow smoke test.' > "$prompt_file"
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue --turns 2 --workdir . --agent-a fake --agent-b fake --prompt-file "$prompt_file" --transcript "$transcript_file" --timeout 10
          skills/tmux-agent-tools/scripts/tmux-agent-dialogue validate-transcript --transcript "$transcript_file"
          jq -e 'select(.event == "turn" and .turn == 1 and .speaker == "agent-a")' "$transcript_file"
          jq -e 'select(.event == "turn" and .turn == 2 and .speaker == "agent-b")' "$transcript_file"

      - name: Build release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ruby -e '
            version = ENV.fetch("VERSION")
            changelog = File.read("CHANGELOG.md")
            pattern = /^## #{Regexp.escape(version)}(?:\s+-[^\n]*)?\n(?<body>.*?)(?=^## |\z)/m
            match = changelog.match(pattern)
            abort("CHANGELOG.md is missing a #{version} section") unless match
            body = match[:body].strip
            abort("CHANGELOG.md #{version} section is empty") if body.empty?
            File.write("release-notes.md", body + "\n")
          '
          rg -n "." release-notes.md

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          TESTED_SHA: ${{ steps.record_sha.outputs.sha }}
        run: |
          echo "dry run: would create annotated tag and GitHub release for ${VERSION} at commit ${TESTED_SHA}"

  publish:
    runs-on: macos-latest
    timeout-minutes: 10
    needs: validate
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write

    steps:
      - name: Check out tested candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tested_sha }}
          fetch-depth: 0

      - name: Refuse if main moved since validate
        env:
          TESTED_SHA: ${{ needs.validate.outputs.tested_sha }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$TESTED_SHA" != "$current_main" ]]; then
            echo "Refusing to publish: main moved since validate (tested: ${TESTED_SHA}, main tip: ${current_main})" >&2
            exit 1
          fi

      - name: Build release notes from tested checkout
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ruby -e '
            version = ENV.fetch("VERSION")
            changelog = File.read("CHANGELOG.md")
            pattern = /^## #{Regexp.escape(version)}(?:\s+-[^\n]*)?\n(?<body>.*?)(?=^## |\z)/m
            match = changelog.match(pattern)
            abort("CHANGELOG.md is missing a #{version} section") unless match
            body = match[:body].strip
            abort("CHANGELOG.md #{version} section is empty") if body.empty?
            File.write("release-notes.md", body + "\n")
          '

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          TESTED_SHA: ${{ needs.validate.outputs.tested_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$TESTED_SHA" -m "$VERSION"
          git push origin "$VERSION"
          prerelease_flag=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md "${prerelease_flag[@]}"
